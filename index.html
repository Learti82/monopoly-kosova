    '<button class="btn" data-ui="sound">Efektet zanore: '+(soundOn?'po':'jo')+'</button>'+
    '<button class="btn" data-ui="rules">Rregullat</button>'+
    '<button class="btn" data-ui="setup">Lojë e re</button>'+
    '<button class="btn" data-ui="credits">Autorët e fotove</button></div><p class="note" style="margin-top:12px">Versioni 19.11 (v13)</p>');
}
function openLog(){modalState={k:'logs'};showModal('<button class="btn sm x" data-ui="close">Mbyll</button><h3>Ngjarjet</h3><div class="log" style="max-height:none">'+st.log.slice(0,60).map(l=>'<div>'+l+'</div>').join('')+'</div>')}
function openRoomSheet(){
  if(!net)return; if(!(st&&st.online)){openLobby();return}
  modalState={k:'roomSheet'};
  const mem=net.members.map(m=>'<div class="mem">'+micBadge(m)+'<span>'+esc(m.name)+(m.dev===myDev?' (ti)':'')+(m.spectator?' · shikues':'')+'</span></div>').join('');
  showModal('<button class="btn sm x" data-ui="close">Mbyll</button><h3>Dhoma '+esc(net.code||'')+'</h3>'+netStatusLine()+'<div class="members">'+mem+'</div>'+voiceButtons()+shareRow()+
    '<div class="row" style="margin-top:10px"><button class="btn sm dan" data-ui="leave">Dil nga dhoma</button></div>');
}
function micButton(){const v=net&&net.voice;if(!v)return;if(!v.on)joinVoice();else if(v.listenOnly)openRoomSheet();else toggleMute()}
function renderMic(){
  const b=$('#micBtn'); if(!b)return; b.hidden=!net;
  if(!net)return; const v=net.voice, live=v.on&&!v.muted&&!v.listenOnly;
  b.setAttribute('aria-pressed',live); b.title=!v.on?'Fol me zë':v.muted?'Je i heshtur':'Mikrofoni ndezur';
  b.querySelector('svg').innerHTML=(v.on&&!v.muted&&!v.listenOnly?'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>':'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/>');
}
/* phones: go full screen when a game starts (Android); on iPhone explain Add to Home Screen once */
function autoFull(){
  if(!isPhone()||standalone)return;
  const el=document.documentElement, req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req&&!(document.fullscreenElement||document.webkitFullscreenElement)){try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}catch(e){}return}
  if(!req){let seen=false;try{seen=localStorage.getItem('pk-fshint')==='1';localStorage.setItem('pk-fshint','1')}catch(e){}if(!seen)setTimeout(fsHelp,400)}
}
/* watchdog: if the engine is ever busy for too long, unlock the turn */
let busyFor=0;
setInterval(()=>{if(!st||!engine())return;if(busy){busyFor+=1000;if(busyFor>=20000){console.warn('unstuck');busy=false;busyFor=0;cont()}}else busyFor=0;
  if(rollingAnim&&!busy){rollingAnim=false;renderCenterHint()}},1000);
/* ======================= EVENTS ======================= */
const UI={
  deed:i=>openDeed(i), close:closeModal, rules:openRules, credits:openCredits,
  pickFig:f=>pickFig(f), makeFair:()=>makeFair(), menu:()=>openMenu(), logs:()=>openLog(), roomSheet:()=>openRoomSheet(), mic:()=>micButton(),
  pf:i=>openPortfolio(i), pfSel:i=>{pf.sel=+i;if(modalState&&modalState.k==='pf')openPortfolio(+i);else renderPortfolio()},
  pfPin:()=>{pf.pin=!pf.pin;try{localStorage.setItem('pk-pfpin',pf.pin?'1':'0')}catch(e){}if(modalState&&modalState.k==='pf')closeModal();renderPortfolio();if(pf.pin){const el=$('#pfPanel');if(el&&isPhone())el.scrollIntoView({behavior:'smooth',block:'start'})}},
  setup:()=>openSetup(), tab:t=>{modalState.tab=t;openSetup(t)}, start:()=>{autoFull();startFromSetup()},
  trade:()=>openTrade(), propose:proposeTrade,
  host:()=>{autoFull();hostRoom()}, join:()=>{autoFull();joinRoom()}, lobby:openLobby, startOnline:()=>{autoFull();startOnline()},
  copyLink:()=>{const l=net&&net.code?inviteLink():'';const done=()=>{const c=$('#copied');if(c)c.textContent='U kopjua.';else toastRoom('Linku u kopjua.')};
    try{navigator.clipboard.writeText(l).then(done,()=>{const i=$('#invite');if(i){i.select()}else toastRoom(l)})}catch(e){toastRoom(l)}},
  leave:()=>{leaveNet();if(st&&st.online){newGame([{name:'Ti',bot:false},{name:'Arbeni',bot:true},{name:'Drita',bot:true}],false);openSetup('online')}},
  shareLink:()=>{try{navigator.share({title:'Pronat e Kosovës',text:'Eja luajmë Pronat e Kosovës! Kodi: '+net.code,url:inviteLink()}).catch(()=>{})}catch(e){}},
  voiceOn:joinVoice, voiceOff:()=>leaveVoice(false), mute:toggleMute,
  sound:()=>{soundOn=!soundOn;try{localStorage.setItem('pk-sound',soundOn?'1':'0')}catch(e){}$('#sndBtn').setAttribute('aria-pressed',soundOn);if(modalState&&modalState.k==='menu')openMenu()},
  tilt:()=>setView('tilt',!view.tilt), zoom:()=>setView('zoom',!view.zoom), fullscreen:toggleFs,
};
document.addEventListener('click',e=>{
  sfxUnlock();
  if(e.target.dataset&&e.target.dataset.ovl&&modalState&&modalState.k!=='offer'){closeModal();return}
  if(e.target.closest('#tray')&&canRollNow()){doAction('roll');return}
  const b=e.target.closest('[data-act],[data-ui]'); if(!b||b.disabled)return;
  if(b.dataset.act){doAction(b.dataset.act,b.dataset.arg);return}
  const f=UI[b.dataset.ui]; if(f)f(b.dataset.arg);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modalState&&modalState.k!=='offer'){closeModal();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList){
    if(e.target.classList.contains('cell')){e.preventDefault();openDeed(e.target.dataset.arg)}
    else if(e.target.classList.contains('pl')){e.preventDefault();openPortfolio(e.target.dataset.arg)}
    else if(e.target.id==='tray'&&canRollNow()){e.preventDefault();doAction('roll')}
  }
});
addEventListener('beforeunload',e=>{if(role==='host'&&net){e.preventDefault();e.returnValue=''}});
addEventListener('resize',()=>{if(st&&!rollingAnim)restDice(st.dice,true);if(st){Object.keys(pawnAt).forEach(x=>delete pawnAt[x]);renderPawns();renderBuildings()}});
$('#sndBtn').setAttribute('aria-pressed',soundOn);
/* ---------- view: 3D tilt, zoom, full screen ---------- */
const isPhone=()=>matchMedia('(max-width:980px)').matches;
const view={tilt:false,zoom:false};
function loadPref(k,d){try{const v=localStorage.getItem('pk-'+k);return v==null?d:v==='1'}catch(e){return d}}
function setView(k,on,quiet){
  view[k]=on; if(!quiet){try{localStorage.setItem('pk-'+(k==='tilt'?'tilt3':k),on?'1':'0')}catch(e){}}
  if(k==='tilt')$('#board').classList.toggle('tilt',on);
  if(k==='zoom')$('.board-wrap').classList.toggle('zoom',on);
  $('#'+k+'Btn').setAttribute('aria-pressed',on);
  if(st){Object.keys(pawnAt).forEach(x=>delete pawnAt[x]);requestAnimationFrame(()=>{renderPawns();renderBuildings();if(view.zoom)follow(pawnEls[st.cur])})}
}
const standalone=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
if(standalone)$('#fsBtn').hidden=true;
function toggleFs(){
  const d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req){try{const r=req.call(el,{navigationUI:'hide'});if(r&&r.catch)r.catch(fsHelp)}catch(e){fsHelp()}return}
  fsHelp();
}
function fsHelp(){
  modalState={k:'fs'};
  showModal('<button class="btn sm x" data-ui="close">Mbyll</button><h3>Luaj në ekran të plotë</h3>'+
   '<p>Në iPhone shfletuesi nuk e lejon ekranin e plotë direkt. Shtoje lojën në ekranin kryesor dhe hapet si aplikacion, pa shiritat e shfletuesit:</p>'+
   '<ol><li>Shtyp butonin <b>Ndaj</b> (katrori me shigjetë lart) në Safari ose Chrome.</li><li>Zgjidh <b>Shto në ekranin kryesor</b> (Add to Home Screen).</li><li>Hape lojën nga ikona e re.</li></ol>'+
   '<p class="note">Kthe telefonin horizontalisht për ta parë tabelën më të madhe.</p>');
}
setView('tilt',loadPref('tilt3',true),true);
setView('zoom',loadPref('zoom',false),true);
/* the docked action bar on phones: keep the page padded by its height */
try{new ResizeObserver(()=>{const a=$('#act');document.documentElement.style.setProperty('--dock-h',(getComputedStyle(a).position==='fixed'?a.offsetHeight:0)+'px')}).observe($('#act'))}catch(e){}

/* ======================= BOOT ======================= */
(function boot(){
  initBoard();
  const invite=new URLSearchParams(location.search).get('dhoma');
  const saved=loadSaved();
  if(saved&&saved.winner==null&&saved.players&&!saved.online&&!invite){st=saved;shownRoll=null;render();}
  else{
    newGame([{name:'Ti',bot:false},{name:'Arbeni',bot:true},{name:'Drita',bot:true}],false);
    openSetup(invite||ONLINE_OK?'online':'local');
    let rj=null;try{rj=JSON.parse(sessionStorage.getItem('pk-join')||'null')}catch(e){}
    if(invite&&ONLINE_OK&&rj&&rj.code===invite.toUpperCase()&&rj.name&&$('#on-name')){$('#on-name').value=rj.name;joinRoom()}
  }
})();
